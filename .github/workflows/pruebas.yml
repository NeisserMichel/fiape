name: Pruebas de la base de datos
on:
  workflow_dispatch:
  push:
    paths: ['supabase/**', '.github/workflows/pruebas.yml']
jobs:
  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Postgres local
        run: |
          sudo apt-get install -y -q postgresql postgresql-contrib >/dev/null
          PGBIN=$(ls -d /usr/lib/postgresql/*/bin | tail -1)
          mkdir -p /tmp/pg && sudo chown postgres /tmp/pg
          sudo -u postgres $PGBIN/initdb -D /tmp/pg/data -A trust -E UTF8 --locale=C.UTF-8 >/dev/null
          sudo -u postgres $PGBIN/pg_ctl -D /tmp/pg/data -o "-k /tmp/pg -p 5544" -l /tmp/pg/log start
      - name: Registro, verificación, búsqueda, calificaciones, ranking y seguridad
        run: |
          sh supabase/tests/correr.sh | tee resultado.txt
          grep -q "TODAS LAS PRUEBAS PASARON" resultado.txt
