name: Compilar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          JAR=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)/android.jar
          cd android && mkdir -p build/classes build/dex build/gen
          "$BT/aapt2" compile --dir res -o build/res.zip
          "$BT/aapt2" link -o build/base.apk -I "$JAR" --manifest AndroidManifest.xml \
            --min-sdk-version 23 --target-sdk-version 34 --version-code ${{ github.run_number }} --version-name 1.${{ github.run_number }} \
            --java build/gen build/res.zip
          javac -source 8 -target 8 -cp "$JAR" -d build/classes $(find src build/gen -name '*.java')
          "$BT/d8" --lib "$JAR" --min-api 23 --output build/dex $(find build/classes -name '*.class')
          (cd build/dex && zip -q ../base.apk classes.dex)
          "$BT/zipalign" -f -p 4 build/base.apk build/aligned.apk
          echo "BT=$BT" >> "$GITHUB_ENV"
      - name: Firmar
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          cd android/build
          if [ -n "${KS_B64:-}" ]; then
            echo "$KS_B64" | base64 -d > firma.jks; PASS="$KS_PASS"
          else
            echo "::warning::Sin secreto ANDROID_KEYSTORE_B64: se firma con una llave temporal. Las actualizaciones necesitarán desinstalar la versión anterior. Ver README.md."
            PASS=temporal-$RANDOM$RANDOM
            keytool -genkeypair -keystore firma.jks -alias fiape -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Fiape, C=PE" >/dev/null
          fi
          "$BT/apksigner" sign --ks firma.jks --ks-pass "pass:$PASS" --out fiape.apk aligned.apk
          rm -f firma.jks
          mkdir -p ../../out && cp fiape.apk ../../out/
      - name: Publicar en la rama apk-build
        run: |
          cd out && git init -q && git checkout -q -b apk-build && git add .
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "APK ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk-build
      - name: Pedir a las apps instaladas que se actualicen
        run: |
          set -e
          git clone -q --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" principal
          cd principal
          printf '{"apk": %s, "url": "https://github.com/%s/raw/apk-build/fiape.apk"}\n' "${{ github.run_number }}" "${{ github.repository }}" > app/version.json
          git add app/version.json
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "APK ${{ github.run_number }}: pedir actualización a las apps instaladas" || exit 0
          git pull -q --rebase && git push -q origin HEAD:main
