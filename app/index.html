<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b2a63">
<title>Fiapé</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE serio y cercano: "consulta antes de confiar"
   IDEA la ficha de una persona con su nota de confianza, como un certificado
   COLOUR azul profundo #0b2a63 de la marca, dorado #f5b700 solo para estrellas y notas
   TYPE Sora 800 para notas y títulos + Inter para texto
   LAYOUT una columna tipo teléfono; el panel de administrador se ensancha en escritorio */
:root{color-scheme:light;
  --bg:#f3f5fa;--card:#fff;--ink:#0f1830;--mute:#56607a;--line:#dde2ee;
  --b:#0b2a63;--b2:#163f8f;--bl:#e6edfb;--gold:#f5b700;--goldd:#a57a00;
  --ok:#0d6b3a;--okbg:#dcf3e6;--warn:#6b4c00;--warnbg:#fff1c2;--bad:#9c1b16;--badbg:#fde2df;--info:#0b4f86;--infobg:#ddefff}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Sora,Inter,system-ui,sans-serif;letter-spacing:-.02em;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:26px;font-weight:800}h2{font-size:20px;font-weight:800}h3{font-size:17px;font-weight:700}
p{margin:6px 0 0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--b2)}
.top{background:var(--b);color:#fff;position:sticky;top:0;z-index:10}
.top .in{max-width:560px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.wide .top .in,.wide .wrap{max-width:1000px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:#fff;font:800 22px Sora,Inter,sans-serif}
.brand img{width:32px;height:32px;border-radius:8px}
.who{font-size:13px;opacity:.85;text-align:right;line-height:1.2}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 110px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:10;padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.nav button{border:0;background:none;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 12px Inter;color:var(--mute);cursor:pointer}
.nav button[aria-current=true]{color:var(--b)}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
label{display:block;font-weight:600;font-size:14px;margin-top:12px}
label small{font-weight:400;color:var(--mute)}
input,select,textarea{width:100%;min-height:48px;margin-top:4px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--b2);box-shadow:0 0 0 3px var(--bl)}
input[readonly]{background:var(--bg);color:var(--mute)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;margin-top:16px;padding:10px 16px;border:0;border-radius:14px;background:var(--b);color:#fff;font-weight:700;cursor:pointer;text-decoration:none}
.btn:disabled{opacity:.55;cursor:default}
.btn.sec{background:var(--bl);color:var(--b)}
.btn.ghost{background:none;color:var(--b);border:1.5px solid var(--line)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btns .btn{margin-top:12px}
.link{background:none;border:0;padding:8px 0;color:var(--b2);font-weight:600;text-decoration:underline;cursor:pointer;min-height:44px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:14px;padding:4px;gap:4px;margin-top:16px}
.seg button{min-height:44px;border:0;border-radius:10px;background:none;font-weight:700;cursor:pointer;color:var(--mute)}
.seg button[aria-selected=true]{background:var(--card);color:var(--ink)}
.note{border-radius:14px;padding:12px 14px;margin-top:12px;font-size:15px}
.note.info{background:var(--infobg);color:var(--info)}.note.ok{background:var(--okbg);color:var(--ok)}
.note.warn{background:var(--warnbg);color:var(--warn)}.note.bad{background:var(--badbg);color:var(--bad)}
.tag{display:inline-block;font:700 12px Inter;border-radius:8px;padding:3px 8px;white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.bad{background:var(--badbg);color:var(--bad)}.tag.info{background:var(--infobg);color:var(--info)}.tag.mute{background:var(--line);color:var(--mute)}
.mute{color:var(--mute)}.small{font-size:14px}
.hero{background:var(--b);color:#fff;padding:30px 20px 64px;text-align:center}
.hero img{width:76px;height:76px;border-radius:20px}
.hero h1{font-size:36px;margin-top:8px}.hero p{margin:6px auto 0;max-width:32ch;opacity:.9}
.hero + .wrap .card:first-child{margin-top:-46px}
.search{display:flex;gap:8px}
.search input{margin:0}
.search button{flex:none;width:56px;min-height:48px;border:0;border-radius:12px;background:var(--b);color:#fff;display:grid;place-items:center;cursor:pointer}
.person{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.person h3{overflow-wrap:anywhere}
.score{text-align:right}
.score b{display:block;font:800 30px/1 Sora,Inter,sans-serif;color:var(--ink);white-space:nowrap}
.score b small{font-size:15px;color:var(--mute);font-weight:700}
.bar{position:relative;height:8px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden;grid-column:1/-1}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--gold);border-radius:4px}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:var(--mute);grid-column:1/-1}
.stars{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.stars button{aspect-ratio:1;border:2px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;display:grid;place-items:center;gap:0;padding:4px;color:var(--line)}
.stars button svg{width:60%;height:60%}
.stars button span{font:800 13px Sora,Inter;color:var(--mute);line-height:1}
.stars button.on{border-color:var(--gold);color:var(--gold);background:#fff8e0}
.stars button.on span{color:var(--goldd)}
.big{font:800 54px/1 Sora,Inter,sans-serif;text-align:center;margin-top:14px}
.big small{font-size:22px;color:var(--mute)}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:6px;gap:12px}
.rank{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.rank:first-child{border-top:0}
.pos{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:800 16px Sora,Inter;background:var(--bl);color:var(--b)}
.pos.p1{background:var(--gold);color:#3d2c00}.pos.p2{background:#d5dbe6;color:#2c3446}.pos.p3{background:#e8c39e;color:#4a2c10}
.rank b{font:800 20px Sora,Inter;white-space:nowrap}
.shot{border:2px dashed var(--line);border-radius:16px;padding:12px;margin-top:12px;display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center}
.shot.done{border-style:solid;border-color:var(--ok)}
.shot .th{width:76px;height:76px;border-radius:12px;background:var(--bl);display:grid;place-items:center;color:var(--b);overflow:hidden}
.shot .th img{width:100%;height:100%;object-fit:cover}
.shot input{position:absolute;width:1px;height:1px;opacity:0}
.shot .pickb{display:inline-flex;align-items:center;min-height:44px;margin-top:6px;padding:6px 14px;border-radius:12px;background:var(--bl);color:var(--b);font-weight:700;cursor:pointer;font-size:14px}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.ph a{display:block}.ph img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--line)}
.ph figcaption{font-size:12px;color:var(--mute);text-align:center}
.ph figure{margin:0}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:10px 0 0;font-size:15px}
.dl dt{color:var(--mute)}.dl dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{min-height:40px;border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:4px 12px;font-size:14px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:0 12px}
.empty{color:var(--mute);text-align:center;padding:22px 8px}
.spin{display:grid;place-items:center;min-height:60vh;color:var(--mute)}
.ov{position:fixed;inset:0;background:rgba(8,14,30,.6);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px 28px}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:22px}}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;z-index:40;max-width:min(92vw,480px);box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:15px}
@media(prefers-reduced-motion:no-preference){.toast{animation:dn .25s ease-out}}
@keyframes dn{from{transform:translate(-50%,-14px);opacity:0}}
.pw{position:relative}.pw input{padding-right:54px}
.eye{position:absolute;right:3px;top:calc(50% + 2px);transform:translateY(-50%);width:44px;height:44px;border:0;border-radius:10px;background:none;color:var(--mute);display:grid;place-items:center;cursor:pointer}
.eye[aria-pressed=true]{color:var(--b)}
.upd{position:fixed;inset:0;z-index:60;background:var(--b);color:#fff;display:grid;place-items:center;padding:24px;text-align:center}
.upd .btn{background:var(--gold);color:#2b1f00}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div id="app"><div class="spin">Cargando…</div></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
